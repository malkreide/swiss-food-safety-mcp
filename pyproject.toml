[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-food-safety-mcp"
version = "1.1.5"
description = "MCP Server for Swiss Federal Food Safety and Veterinary Office (BLV) open data — no auth required"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "malkreide", url = "https://github.com/malkreide" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "swiss-open-data",
    "food-safety",
    "blv",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "defusedxml>=0.7.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    # Exakt gepinnt, nicht `>=`: ruff ist ein Gate, kein Hilfsmittel. Eine
    # neuere Version meldet Abweichungen an Code, den niemand angefasst hat.
    # Der Pin steht hier und nur hier — die CI installiert ihn ueber das
    # `dev`-Extra mit und hat keinen eigenen Pin-Schritt mehr. Beim Anheben:
    # Version aendern, `ruff format` einmal ueber die gelinteten Pfade laufen
    # lassen und das Ergebnis mit committen.
    # `tests/test_werkzeug_versionen.py` faellt, wenn hier wieder eine
    # Spanne steht oder ein Workflow eine zweite Version setzt.
    "ruff==0.16.1",
    "httpx",
]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
]

[project.scripts]
swiss-food-safety-mcp = "swiss_food_safety_mcp.server:main"

[project.urls]
Homepage = "https://github.com/malkreide/swiss-food-safety-mcp"
Repository = "https://github.com/malkreide/swiss-food-safety-mcp"
Issues = "https://github.com/malkreide/swiss-food-safety-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_food_safety_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit live external APIs — excluded from CI (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
